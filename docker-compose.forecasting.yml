services:
  forecasting-train:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.forecasting
    environment:
      MLFLOW_TRACKING_URI: sqlite:////workspace/mlflow-data/mlflow.db
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./forecasting/data:/workspace/forecasting/data
      - ./forecasting/artifacts:/workspace/forecasting/artifacts
      - ./mlflow-data:/workspace/mlflow-data
    command:
      - python
      - -m
      - forecasting.train
      - --models
      - rnn
      - lstm

  forecasting-inference:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.forecasting
    environment:
      MODEL_PATH: /workspace/forecasting/artifacts/best_model.pt
      DEVICE: cpu
    ports:
      - "5002:8000"
    volumes:
      - ./forecasting/artifacts:/workspace/forecasting/artifacts:ro
    command:
      - uvicorn
      - forecasting.inference_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
