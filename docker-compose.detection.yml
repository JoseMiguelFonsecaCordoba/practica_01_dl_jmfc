services:
  object-detection:
    build:
      context: .
      dockerfile: Dockerfile.detection

    container_name: object-detection-app

    ports:
      - "5001:5001"

    environment:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: ""

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
