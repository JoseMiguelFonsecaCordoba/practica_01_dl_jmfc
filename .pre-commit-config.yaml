repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^forecasting/
      - id: ruff-format
        files: ^forecasting/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        files: ^(forecasting/|docker-compose\.forecasting.*\.yml$|\.pre-commit-config\.yaml$)
      - id: end-of-file-fixer
        files: ^(forecasting/|README\.md$|Dockerfile\.forecasting$|docker-compose\.forecasting.*\.yml$|\.pre-commit-config\.yaml$|pytest\.ini$)
      - id: trailing-whitespace
        files: ^(forecasting/|README\.md$|Dockerfile\.forecasting$|docker-compose\.forecasting.*\.yml$|\.pre-commit-config\.yaml$|pytest\.ini$)
      - id: check-added-large-files
        args: [--maxkb=10000]
        files: ^(forecasting/|Dockerfile\.forecasting$|docker-compose\.forecasting.*\.yml$|\.pre-commit-config\.yaml$|pytest\.ini$)
